<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập - Đề 05</title>
    <link rel="stylesheet" href="baitap.css">
</head>
<body>
    <div class="khung">

        <!-- 1. HEADER + MENU -->
        <header id="trangchu">
            <div class="logo"><a href="#trangchu"><img src="images/logo.png" alt="Logo"></a></div>
            <nav class="menu">
                <ul>
                    <li><a href="#trangchu">Trang chủ</a></li>
                    <li><a href="#sanpham">Sản phẩm</a></li>
                    <li><a href="#lienhe">Liên hệ</a></li>
                </ul>
            </nav>
        </header>

        <!-- 2. BANNER -->
        <div class="banner">
            <img src="images/banner.jpg" alt="Leo núi">
        </div>

        <!-- 3. SẢN PHẨM MỚI -->
        <h3 id="sanpham">SẢN PHẨM MỚI</h3>
        <article>
            <div class="prod">
                <a class="hinh" href="#sanpham"><img class="image" src="images/ao-leo-nui.jpg" alt="Áo leo núi"></a>
                <table>
                    <tr>
                        <td class="nameprod"><a href="#sanpham">ÁO LEO NÚI</a></td>
                        <td class="price"><a href="#sanpham">250K</a></td>
                    </tr>
                </table>
            </div>
            <div class="prod">
                <a class="hinh" href="#sanpham"><img class="image" src="images/quan-leo-nui.jpg" alt="Quần leo núi"></a>
                <table>
                    <tr>
                        <td class="nameprod"><a href="#sanpham">QUẦN LEO NÚI</a></td>
                        <td class="price"><a href="#sanpham">300K</a></td>
                    </tr>
                </table>
            </div>
            <div class="prod">
                <a class="hinh" href="#sanpham"><img class="image" src="images/balo.jpg" alt="Balo FIFA"></a>
                <table>
                    <tr>
                        <td class="nameprod"><a href="#sanpham">BALO FIFA</a></td>
                        <td class="price"><a href="#sanpham">600K</a></td>
                    </tr>
                </table>
            </div>
            <div class="prod">
                <a class="hinh" href="#sanpham"><img class="image" src="images/ao-khoac.jpg" alt="Áo khoác"></a>
                <table>
                    <tr>
                        <td class="nameprod"><a href="#sanpham">ÁO KHOÁC</a></td>
                        <td class="price"><a href="#sanpham">950K</a></td>
                    </tr>
                </table>
            </div>
            <div class="prod">
                <a class="hinh" href="#sanpham"><img class="image" src="images/giay.jpg" alt="Giày leo núi"></a>
                <table>
                    <tr>
                        <td class="nameprod"><a href="#sanpham">GIÀY LEO NÚI</a></td>
                        <td class="price"><a href="#sanpham">1300K</a></td>
                    </tr>
                </table>
            </div>
            <div class="prod">
                <a class="hinh" href="#sanpham"><img class="image" src="images/ao-fifa.jpg" alt="Áo FIFA"></a>
                <table>
                    <tr>
                        <td class="nameprod"><a href="#sanpham">ÁO FIFA</a></td>
                        <td class="price"><a href="#sanpham">600K</a></td>
                    </tr>
                </table>
            </div>
        </article>

        <!-- 4. THANH TÌM KIẾM (form 1) -->
        <form class="timkiem" action="#trangchu" method="get">
            <input type="text" name="q" placeholder="Gõ từ cần tìm kiếm ...." required minlength="2" title="Nhập ít nhất 2 ký tự">
            <button type="submit">Search</button>
        </form>

        <!-- 5. FOOTER: HỌ TÊN SINH VIÊN + FORM LIÊN HỆ (form 2) -->
        <footer class="htsv" id="lienhe">
            <p class="tensv">HỌ TÊN SINH VIÊN</p>
            <form class="lienhe" action="#lienhe" method="post">
                <div class="form-group">
                    <label>Họ tên</label>
                    <input type="text" class="form-control" placeholder="Nguyễn Văn A"
                           required minlength="2" pattern="[^0-9]{2,}"
                           title="Họ tên tối thiểu 2 ký tự và không chứa số" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="ten@gmail.com"
                           required title="Email phải có dạng ten@gmail.com" />
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" class="form-control" placeholder="0912345678"
                           required pattern="0[0-9]{9}"
                           title="Số điện thoại gồm 10 chữ số, bắt đầu bằng số 0" />
                </div>
                <div class="form-group">
                    <label>Nội dung</label>
                    <textarea rows="4" class="form-control" placeholder="Nhập nội dung liên hệ"
                              required minlength="10"
                              title="Nội dung tối thiểu 10 ký tự"></textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="button">Gửi</button>
                </div>
            </form>
        </footer>

    </div>
</body>
</html>
